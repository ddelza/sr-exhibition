<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>활동 페이지 템플릿 — 자극과 반응 전람회</title>
<link rel="stylesheet" href="common.css">
<style>
.card h1 { font-size: 1.05rem; margin: 0 0 10px; color: var(--accent); }
</style>
</head>
<body>

<div class="wrap">
  <div class="who-banner" id="whoBanner"></div>
  <div class="card">
    <h1>새 활동 페이지 템플릿</h1>
    <p>이 파일을 복사해서 실제 차시 활동 페이지(예: session1-1.html)를 만들면,
       index.html에서 이미 확인한 학번/이름을 다시 입력받지 않고 그대로 이어받아 쓸 수 있다.</p>
    <p>이 페이지를 직접 열면(로그인 안 된 상태) 자동으로 index.html로 돌아간다. 먼저
       index.html에서 학번/이름을 입력해 입장한 뒤, 개발자도구 콘솔에서
       <code>location.href='template.html'</code> 로 이동해서 테스트해볼 수 있다.</p>
  </div>
</div>

<!-- session.js를 불러오면 requireSrLogin() / getSrStudent() / srLogout()을 쓸 수 있다 -->
<script src="session.js"></script>
<script>
// 로그인 안 되어 있으면 자동으로 index.html로 돌려보내고 null을 반환한다.
const student = requireSrLogin();
if (student) {
  // student = { id, name, grade, ban, num, email }
  document.getElementById('whoBanner').textContent =
    `${student.grade}학년 ${student.ban}반 ${student.num}번 ${student.name} (학번 ${student.id})`;

  // 제출 폼이 있다면 이렇게 학번/이름을 그대로 채워 넣으면 된다:
  // document.getElementById('submitterId').value = student.id;
  // document.getElementById('submitterName').value = student.name;
}
</script>
</body>
</html>
